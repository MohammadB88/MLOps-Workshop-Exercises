        pipelinechannel--horizons_hours-loop-item:
          parameterType: NUMBER_INTEGER
        pipelinechannel--lab_root:
          parameterType: STRING
        pipelinechannel--pipeline_run_id:
          parameterType: STRING
        pipelinechannel--transform-task-dataset_short_id:
          parameterType: STRING
        pipelinechannel--validate-task-Output:
          parameterType: STRING
        pipelinechannel--window_end:
          parameterType: STRING
  comp-forecast-task:
    executorLabel: exec-forecast-task
    inputDefinitions:
      parameters:
        config_path:
