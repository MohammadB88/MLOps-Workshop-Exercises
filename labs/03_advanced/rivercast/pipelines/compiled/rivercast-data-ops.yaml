pipelineInfo:
  description: '[v1] Hourly data-operations pipeline: fetch, archive, validate, issue
    forecasts from the champion model, and calculate delayed accuracy once predictions
    mature. Educational system; not a flood-warning product.'
  name: rivercast-data-ops
root:
  dag:
    tasks:
      exit-handler-1:
        componentRef:
          name: comp-exit-handler-1
        dependentTasks:
        - run-lock-acquire-task
        inputs:
          parameters:
            pipelinechannel--config_path:
              componentInputParameter: config_path
            pipelinechannel--fixture_dir:
              componentInputParameter: fixture_dir
            pipelinechannel--horizons_hours:
              componentInputParameter: horizons_hours
            pipelinechannel--lab_root:
              componentInputParameter: lab_root
            pipelinechannel--parameter:
              componentInputParameter: parameter
            pipelinechannel--pipeline_run_id:
              componentInputParameter: pipeline_run_id
            pipelinechannel--station_uuids:
              componentInputParameter: station_uuids
            pipelinechannel--window_end:
              componentInputParameter: window_end
            pipelinechannel--window_start:
              componentInputParameter: window_start
        taskInfo:
          name: release-run-lock
      run-lock-acquire-task:
        cachingOptions: {}
        componentRef:
          name: comp-run-lock-acquire-task
        inputs:
          parameters:
            config_path:
              componentInputParameter: config_path
            lab_root:
              componentInputParameter: lab_root
            pipeline_name:
              runtimeValue:
                constant: rivercast-data-ops
            run_id:
              componentInputParameter: pipeline_run_id
        taskInfo:
          name: run-lock-acquire-task
      run-lock-release-task:
        cachingOptions: {}
        componentRef:
          name: comp-run-lock-release-task
        dependentTasks:
        - exit-handler-1
        inputs:
          parameters:
            config_path:
              componentInputParameter: config_path
            lab_root:
              componentInputParameter: lab_root
            pipeline_name:
              runtimeValue:
                constant: rivercast-data-ops
            run_id:
              componentInputParameter: pipeline_run_id
        taskInfo:
          name: run-lock-release-task
        triggerPolicy:
          strategy: ALL_UPSTREAM_TASKS_COMPLETED
  inputDefinitions:
    parameters:
      config_path:
        parameterType: STRING
