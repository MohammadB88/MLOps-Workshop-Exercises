          inputs:
            parameters:
              config_path:
                componentInputParameter: pipelinechannel--config_path
              dataset_short_id:
                componentInputParameter: pipelinechannel--transform-task-dataset_short_id
              horizon_hours:
                componentInputParameter: pipelinechannel--horizons_hours-loop-item
              issue_time:
                componentInputParameter: pipelinechannel--window_end
              lab_root:
                componentInputParameter: pipelinechannel--lab_root
              pipeline_run_id:
                componentInputParameter: pipelinechannel--pipeline_run_id
          taskInfo:
            name: forecast-task
    inputDefinitions:
      parameters:
