          \ *\n\ndef validate_task(config_path: str, lab_root: str, silver_key: str,\
          \ now_utc: str) -> str:\n    \"\"\"Quality gate + freshness check over the\
          \ silver hourly window; returns status.\"\"\"\n    from datetime import\
          \ datetime\n    from pathlib import Path\n\n    from components.validate.component\
          \ import run\n\n    result = run(\n        config_path=Path(config_path),\n\
          \        lab_root=Path(lab_root),\n        silver_key=silver_key,\n    \
