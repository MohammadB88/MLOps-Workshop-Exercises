deploymentSpec:
  executors:
    exec-delayed-metrics-task:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - delayed_metrics_task
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'rivercast' \
          \ &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef delayed_metrics_task(\n    config_path: str, lab_root: str, silver_key:\
          \ str, horizons_hours: list[int], now_utc: str\n) -> str:\n    \"\"\"Join\
          \ every persisted prediction against the silver hourly grid and\n    compute\
          \ delayed MAE/RMSE per horizon; writes one report to\n    ``reports/delayed_metrics/``.\n\
          \    \"\"\"\n    from datetime import datetime\n    from pathlib import\
          \ Path\n\n    from components.common import open_store, read_json, write_json\n\
          \n    from rivercast.config import load_config\n    from rivercast.contracts.hourly\
          \ import HourlyObservation\n    from rivercast.contracts.predictions import\
          \ PredictionRecord\n    from rivercast.processing.delayed_metrics import\
          \ (\n        calculate_delayed_metrics,\n        join_matured_predictions,\n\
          \    )\n    from rivercast.storage import zone_key\n\n    config_p = Path(config_path)\n\
          \    lab_root_p = Path(lab_root)\n    config = load_config(config_p)\n \
          \   store = open_store(config, lab_root_p)\n    now = datetime.fromisoformat(now_utc)\n\
          \n    hourly_rows = read_json(store, silver_key)\n    hourly = [HourlyObservation.model_validate(row)\
          \ for row in hourly_rows]\n\n    predictions: list[PredictionRecord] = []\n\
          \    for horizon in horizons_hours:\n        prefix = zone_key(config.storage.zones,\
          \ \"predictions\", f\"horizon_hours={horizon}\")\n        for key in store.list_keys(f\"\
          {prefix}/\"):\n            predictions.append(PredictionRecord.model_validate(read_json(store,\
          \ key)))\n\n    matured = join_matured_predictions(predictions, hourly,\
          \ now_utc=now)\n    metrics = [calculate_delayed_metrics(matured, horizon)\
          \ for horizon in horizons_hours]\n\n    report = {\n        \"checked_at_utc\"\
          : now.isoformat(timespec=\"seconds\"),\n        \"metrics\": [\n       \
          \     {\n                \"horizon_hours\": m.horizon_hours,\n         \
          \       \"n_matured\": m.n_matured,\n                \"n_total\": m.n_total,\n\
          \                \"mae_cm\": m.mae_cm,\n                \"rmse_cm\": m.rmse_cm,\n\
          \            }\n            for m in metrics\n        ],\n    }\n    report_key\
          \ = zone_key(\n        config.storage.zones,\n        \"reports\",\n   \
          \     \"delayed_metrics\",\n        f\"{silver_key.rsplit('/', 1)[-1].removesuffix('.json')}_delayed_metrics.json\"\
          ,\n    )\n    write_json(store, report_key, report, overwrite=True)\n  \
          \  return \"ok\"\n\n"
        image: python:3.12
    exec-fetch-station-task:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - fetch_station_task
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'rivercast' \
          \ &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef fetch_station_task(\n    config_path: str,\n    lab_root: str,\n\
          \    station_uuid: str,\n    parameter: str,\n    start: str,\n    end:\
          \ str,\n    fixture_dir: str,\n) -> str:\n    \"\"\"One ``components.fetch``\
          \ call for one station; returns its status.\"\"\"\n    from datetime import\
          \ UTC, datetime\n    from pathlib import Path\n\n    from components.fetch.component\
          \ import run\n\n    result = run(\n        config_path=Path(config_path),\n\
          \        lab_root=Path(lab_root),\n        station_uuid=station_uuid,\n\
          \        parameter=parameter,\n        start=datetime.fromisoformat(start).astimezone(UTC),\n\
          \        end=datetime.fromisoformat(end).astimezone(UTC),\n        fixture_dir=Path(fixture_dir)\
          \ if fixture_dir else None,\n    )\n    return result.status\n\n"
        image: python:3.12
    exec-forecast-task:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - forecast_task
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'rivercast' \
          \ &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef forecast_task(\n    config_path: str,\n    lab_root: str,\n \
          \   horizon_hours: int,\n    issue_time: str,\n    dataset_short_id: str,\n\
          \    pipeline_run_id: str,\n) -> str:\n    \"\"\"Load the champion for one\
          \ horizon and issue+persist one prediction\n    from the latest feature\
          \ row in the just-built gold dataset.\n    \"\"\"\n    import io\n    from\
          \ datetime import UTC, datetime\n    from pathlib import Path\n\n    import\
          \ pandas as pd\n    from components.forecast.component import run\n\n  \
          \  from rivercast.config import load_config\n    from rivercast.storage\
          \ import create_object_store, zone_key\n\n    config_p = Path(config_path)\n\
          \    lab_root_p = Path(lab_root)\n    config = load_config(config_p)\n \
          \   storage_root = Path(config.storage.root)\n    if not storage_root.is_absolute():\n\
          \        storage_root = lab_root_p / storage_root\n    store = create_object_store(config.storage.model_copy(update={\"\
          root\": str(storage_root)}))\n\n    prefix = zone_key(config.storage.zones,\
          \ \"gold\", f\"training/dataset_id={dataset_short_id}\")\n    dataset =\
          \ pd.read_parquet(io.BytesIO(store.get_bytes(f\"{prefix}/dataset.parquet\"\
          )))\n    feature_columns = [\n        c for c in dataset.columns if not\
          \ c.startswith(\"target_level_\") and c != \"issue_time_utc\"\n    ]\n \
          \   latest_row = dataset.iloc[-1][feature_columns].fillna(0.0)\n    features\
          \ = {col: float(latest_row[col]) for col in feature_columns}\n\n    result\
          \ = run(\n        config_path=config_p,\n        lab_root=lab_root_p,\n\
          \        horizon_hours=horizon_hours,\n        issue_time=datetime.fromisoformat(issue_time).astimezone(UTC),\n\
          \        features=features,\n        created_by_pipeline_run=pipeline_run_id,\n\
          \    )\n    return result.status\n\n"
        image: python:3.12
    exec-monitor-task:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - monitor_task
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'rivercast' \
          \ &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef monitor_task(\n    config_path: str, lab_root: str, silver_key:\
          \ str, dataset_short_id: str, now_utc: str\n) -> str:\n    \"\"\"Freshness/coverage\
          \ summary, independent of whether validation passed,\n    plus (best-effort)\
          \ delayed performance/drift/retraining-signal per\n    horizon (PLAN.md\
          \ Phase 12) once ``dataset_short_id`` names a real gold\n    dataset --\
          \ passed through even on a failed validation so monitoring\n    still reports\
          \ on whatever data exists.\n    \"\"\"\n    from datetime import datetime\n\
          \    from pathlib import Path\n\n    from components.monitor.component import\
          \ run\n\n    result = run(\n        config_path=Path(config_path),\n   \
          \     lab_root=Path(lab_root),\n        silver_key=silver_key,\n       \
          \ dataset_short_id=dataset_short_id or None,\n        now_utc=datetime.fromisoformat(now_utc),\n\
          \    )\n    return result.status\n\n"
        image: python:3.12
    exec-run-lock-acquire-task:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - run_lock_acquire_task
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'rivercast' \
          \ &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

