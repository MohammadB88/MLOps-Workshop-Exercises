# PIPELINE DEFINITION
# Name: rivercast-data-ops
# Description: [v1] Hourly data-operations pipeline: fetch, archive, validate, issue forecasts from the champion model, and calculate delayed accuracy once predictions mature. Educational system; not a flood-warning product.
# Inputs:
#    config_path: str
#    fixture_dir: str [Default: '']
#    horizons_hours: list
#    lab_root: str
#    parameter: str
#    pipeline_run_id: str [Default: '']
#    station_uuids: list
#    window_end: str
#    window_start: str
components:
  comp-condition-3:
    dag:
      tasks:
        for-loop-4:
          componentRef:
            name: comp-for-loop-4
          inputs:
            parameters:
              pipelinechannel--config_path:
                componentInputParameter: pipelinechannel--config_path
              pipelinechannel--horizons_hours:
                componentInputParameter: pipelinechannel--horizons_hours
              pipelinechannel--lab_root:
                componentInputParameter: pipelinechannel--lab_root
              pipelinechannel--pipeline_run_id:
                componentInputParameter: pipelinechannel--pipeline_run_id
              pipelinechannel--transform-task-dataset_short_id:
                componentInputParameter: pipelinechannel--transform-task-dataset_short_id
              pipelinechannel--validate-task-Output:
                componentInputParameter: pipelinechannel--validate-task-Output
              pipelinechannel--window_end:
                componentInputParameter: pipelinechannel--window_end
          iteratorPolicy:
            parallelismLimit: 2
          parameterIterator:
            itemInput: pipelinechannel--horizons_hours-loop-item
            items:
              inputParameter: pipelinechannel--horizons_hours
          taskInfo:
            name: for-loop-4
    inputDefinitions:
      parameters:
        pipelinechannel--config_path:
          parameterType: STRING
        pipelinechannel--horizons_hours:
          parameterType: LIST
        pipelinechannel--lab_root:
          parameterType: STRING
        pipelinechannel--pipeline_run_id:
          parameterType: STRING
        pipelinechannel--transform-task-dataset_short_id:
          parameterType: STRING
        pipelinechannel--validate-task-Output:
          parameterType: STRING
        pipelinechannel--window_end:
          parameterType: STRING
  comp-delayed-metrics-task:
    executorLabel: exec-delayed-metrics-task
    inputDefinitions:
      parameters:
        config_path:
          parameterType: STRING
        horizons_hours:
          parameterType: LIST
        lab_root:
          parameterType: STRING
        now_utc:
          parameterType: STRING
        silver_key:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-exit-handler-1:
    dag:
      tasks:
        condition-3:
          componentRef:
            name: comp-condition-3
          dependentTasks:
          - transform-task
          - validate-task
          inputs:
            parameters:
              pipelinechannel--config_path:
                componentInputParameter: pipelinechannel--config_path
              pipelinechannel--horizons_hours:
                componentInputParameter: pipelinechannel--horizons_hours
              pipelinechannel--lab_root:
                componentInputParameter: pipelinechannel--lab_root
              pipelinechannel--pipeline_run_id:
                componentInputParameter: pipelinechannel--pipeline_run_id
              pipelinechannel--transform-task-dataset_short_id:
                taskOutputParameter:
                  outputParameterKey: dataset_short_id
                  producerTask: transform-task
              pipelinechannel--validate-task-Output:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: validate-task
              pipelinechannel--window_end:
                componentInputParameter: pipelinechannel--window_end
          taskInfo:
            name: condition-3
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--validate-task-Output']
              == 'ok'
        delayed-metrics-task:
          cachingOptions: {}
          componentRef:
            name: comp-delayed-metrics-task
          dependentTasks:
          - transform-task
          inputs:
            parameters:
              config_path:
                componentInputParameter: pipelinechannel--config_path
              horizons_hours:
                componentInputParameter: pipelinechannel--horizons_hours
              lab_root:
                componentInputParameter: pipelinechannel--lab_root
              now_utc:
                componentInputParameter: pipelinechannel--window_end
              silver_key:
                taskOutputParameter:
                  outputParameterKey: silver_key
                  producerTask: transform-task
          taskInfo:
            name: delayed-metrics-task
        for-loop-2:
          componentRef:
            name: comp-for-loop-2
          inputs:
            parameters:
              pipelinechannel--config_path:
                componentInputParameter: pipelinechannel--config_path
              pipelinechannel--fixture_dir:
                componentInputParameter: pipelinechannel--fixture_dir
              pipelinechannel--lab_root:
                componentInputParameter: pipelinechannel--lab_root
              pipelinechannel--parameter:
                componentInputParameter: pipelinechannel--parameter
              pipelinechannel--station_uuids:
                componentInputParameter: pipelinechannel--station_uuids
              pipelinechannel--window_end:
                componentInputParameter: pipelinechannel--window_end
              pipelinechannel--window_start:
                componentInputParameter: pipelinechannel--window_start
          iteratorPolicy:
            parallelismLimit: 4
          parameterIterator:
            itemInput: pipelinechannel--station_uuids-loop-item
            items:
              inputParameter: pipelinechannel--station_uuids
          taskInfo:
            name: for-loop-2
        monitor-task:
          cachingOptions: {}
          componentRef:
            name: comp-monitor-task
          dependentTasks:
          - transform-task
          inputs:
            parameters:
              config_path:
                componentInputParameter: pipelinechannel--config_path
              dataset_short_id:
                taskOutputParameter:
                  outputParameterKey: dataset_short_id
                  producerTask: transform-task
              lab_root:
                componentInputParameter: pipelinechannel--lab_root
              now_utc:
                componentInputParameter: pipelinechannel--window_end
              silver_key:
                taskOutputParameter:
                  outputParameterKey: silver_key
                  producerTask: transform-task
          taskInfo:
            name: monitor-task
        transform-task:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-transform-task
          dependentTasks:
          - for-loop-2
          inputs:
            parameters:
              config_path:
                componentInputParameter: pipelinechannel--config_path
              end:
                componentInputParameter: pipelinechannel--window_end
              lab_root:
                componentInputParameter: pipelinechannel--lab_root
              start:
                componentInputParameter: pipelinechannel--window_start
          taskInfo:
            name: transform-task
        validate-task:
          cachingOptions: {}
          componentRef:
            name: comp-validate-task
          dependentTasks:
          - transform-task
          inputs:
            parameters:
              config_path:
                componentInputParameter: pipelinechannel--config_path
              lab_root:
                componentInputParameter: pipelinechannel--lab_root
              now_utc:
                componentInputParameter: pipelinechannel--window_end
              silver_key:
                taskOutputParameter:
                  outputParameterKey: silver_key
                  producerTask: transform-task
          taskInfo:
            name: validate-task
    inputDefinitions:
      parameters:
        pipelinechannel--config_path:
          parameterType: STRING
        pipelinechannel--fixture_dir:
          parameterType: STRING
        pipelinechannel--horizons_hours:
          parameterType: LIST
        pipelinechannel--lab_root:
          parameterType: STRING
        pipelinechannel--parameter:
          parameterType: STRING
        pipelinechannel--pipeline_run_id:
          parameterType: STRING
        pipelinechannel--station_uuids:
          parameterType: LIST
        pipelinechannel--window_end:
          parameterType: STRING
        pipelinechannel--window_start:
          parameterType: STRING
