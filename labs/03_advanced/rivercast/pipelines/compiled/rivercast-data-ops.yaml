          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef transform_task(config_path: str, lab_root: str, start: str, end:\
          \ str) -> TransformOutputs:\n    \"\"\"Bronze -> silver hourly grid -> gold\
          \ training dataset.\"\"\"\n    from datetime import UTC, datetime\n    from\
          \ pathlib import Path\n\n    from components.transform.component import\
          \ run\n\n    result = run(\n        config_path=Path(config_path),\n   \
          \     lab_root=Path(lab_root),\n        start=datetime.fromisoformat(start).astimezone(UTC),\n\
          \        end=datetime.fromisoformat(end).astimezone(UTC),\n    )\n    if\
          \ result.status != \"ok\":\n        return TransformOutputs(status=result.status,\
          \ dataset_short_id=\"\", silver_key=\"\")\n\n    dataset_id = str(result.metadata[\"\
          dataset_id\"])\n    silver_key = next(k for k in result.output_keys if k.startswith(\"\
          silver/\"))\n    return TransformOutputs(\n        status=result.status,\n\
