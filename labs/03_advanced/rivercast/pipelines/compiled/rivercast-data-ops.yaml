                componentInputParameter: pipelinechannel--lab_root
              parameter:
                componentInputParameter: pipelinechannel--parameter
              start:
                componentInputParameter: pipelinechannel--window_start
              station_uuid:
                componentInputParameter: pipelinechannel--station_uuids-loop-item
          taskInfo:
            name: fetch-station-task
    inputDefinitions:
      parameters:
        pipelinechannel--config_path:
          parameterType: STRING
        pipelinechannel--fixture_dir:
          parameterType: STRING
        pipelinechannel--lab_root:
          parameterType: STRING
        pipelinechannel--parameter:
          parameterType: STRING
        pipelinechannel--station_uuids:
          parameterType: LIST
        pipelinechannel--station_uuids-loop-item:
          parameterType: STRING
        pipelinechannel--window_end:
          parameterType: STRING
        pipelinechannel--window_start:
          parameterType: STRING
  comp-for-loop-4:
    dag:
      tasks:
        forecast-task:
          cachingOptions: {}
          componentRef:
