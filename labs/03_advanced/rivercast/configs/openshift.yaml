# OpenShift AI overlay: S3-compatible object storage via the project's data
# connection. Endpoint and credentials come from environment variables set by
# the data connection — this file stores only variable names, never values.
#
# Stays in fixture mode until the Phase 2 spike pins station UUIDs; switching
# `mode: live` before then fails validation by design.
extends: base.yaml

mode: fixture

storage:
  backend: s3
  # Prefix ("directory") inside the bucket; zones from base.yaml nest below it.
  root: rivercast
  s3:
    bucket: rivercast
    endpoint_url_env_var: AWS_S3_ENDPOINT
    access_key_env_var: AWS_ACCESS_KEY_ID
    secret_key_env_var: AWS_SECRET_ACCESS_KEY
    region_env_var: AWS_DEFAULT_REGION
