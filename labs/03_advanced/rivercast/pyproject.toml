[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rivercast"
version = "0.1.0"
description = "RiverCast — Level-1 continuous forecasting capstone lab (educational; not a flood-warning product)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime dependencies are pinned exactly (PLAN.md Phase 1: locked project
# environment). Bump deliberately, not implicitly.
dependencies = [
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "tzdata==2026.3",
    "pandas==2.3.3",
    "pyarrow==25.0.0",
    "numpy==2.5.1",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "joblib==1.5.3",
    "mlflow==3.15.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "evidently==0.7.21",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260724",
    "nbconvert==7.17.1",
    "nbformat==5.10.4",
    "ipykernel==7.3.0",
    "pandas-stubs==2.3.2.250926",
    "kfp==2.17.0",
    "httpx==0.28.1",
]

[project.scripts]
rivercast = "rivercast.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rivercast*", "components*", "pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "components", "pipelines", "tests"]
extend-exclude = [".venv", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET"]

[tool.mypy]
# numpy's bundled stubs use 3.12 syntax; keep in sync with the CI/workbench
# interpreter (>= 3.11 per requires-python, but stub-checked at 3.12).
python_version = "3.12"
files = ["src", "components", "pipelines"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true

# No published type stubs for these; their public surface used here
# (sklearn Pipeline/Ridge/HistGradientBoostingRegressor, joblib dump/load,
# kfp dsl/compiler, evidently Report/Dataset/presets) is small and stable
# enough to type-check by hand at call sites instead.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "kfp.*", "evidently.*"]
ignore_missing_imports = true
